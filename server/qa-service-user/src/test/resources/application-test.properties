# ==================== 测试环境配置 ====================
# 使用 H2 内存数据库，避免污染开发环境的 MySQL
spring.datasource.url=jdbc:h2:mem:qa_live_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 建表由 JPA 完成，测试环境每次重建
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.format-sql=false
spring.jpa.open-in-view=false

# 关闭 Spring 的初始化脚本（与 JPA 冲突）
spring.sql.init.mode=never

# 测试环境不需要种子数据，种子初始化器读取不到文件时仅记录告警，不影响用例
app.doctor.seed.source=./src/test/resources/seed/doctor-user-list.json
app.patient.seed.source=./src/test/resources/seed/patient-user.json

# 关闭 Actuator 端点，减少测试噪音
management.endpoints.web.exposure.include=health
