spring.application.name=qa-service-user
server.port=8080

# ==================== 数据库配置 ====================
# 连接 docker-compose.yml 中的 MySQL 8.0（库 qa_live）
spring.datasource.url=jdbc:mysql://localhost:3306/qa_live?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 连接池
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==================== JPA / Hibernate ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=false

# 初始化 SQL：建表由 JPA 完成，此处仅关闭 Spring 的初始化脚本（避免与 JPA 冲突）
spring.sql.init.mode=never

# 医生种子数据源（默认为仓库中的前端 JSON 文件，classpath 内有副本兜底）
app.doctor.seed.source=../../web/qa-web/src/data/doctor-user-list.json

# 患者种子数据源（默认为仓库中的前端 JSON 文件，classpath 内有副本兜底）
app.patient.seed.source=../../web/qa-web/src/data/patient-user.json

# ==================== 跨域配置 ====================
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
spring.web.cors.max-age=3600

# ==================== Actuator 配置 ====================
# 启用所有端点
management.endpoints.web.exposure.include=health,info,metrics,env,beans,loggers
# 显示详细的健康信息
management.endpoint.health.show-details=always
# 启用健康检查组件
management.endpoint.health.show-components=always
# 自定义管理端点基础路径（可选）
management.endpoints.web.base-path=/actuator
# 启用 info 端点的贡献者
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# ==================== 应用信息配置 ====================
info.app.name=qa-service-user
info.app.description=QA Service User - Healthcare QA System User Management Service
info.app.version=0.0.1-SNAPSHOT
info.app.encoding=UTF-8
info.app.java.version=17
info.team=QA Healthcare Team
info.environment=development
info.build.timestamp=${BUILD_TIME:2025-11-03}
info.features=CORS,Actuator,Health Checks,User Management,JPA/MySQL,Doctor API
